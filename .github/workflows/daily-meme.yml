name: Daily meme

# A profile README is a static file, so "daily" has to come from somewhere.
# This rewrites one marked block each morning and commits only when the image
# actually changed, so the history stays readable instead of one commit a day
# saying nothing.
#
# v2 (2026-08-15): stop posting duds. Pulling ONE random post from
# r/ProgrammerHumor is a coin flip - a measured sample came back
# [541, 38, 19, 115, 539] upvotes, so most days landed on something nobody
# laughed at. Now it pulls a batch across several subs, drops anything under
# MIN_UPS, and takes the highest-scoring post it has not used recently. The
# same batch endpoint returns posts up to ~20k upvotes, so the ceiling is real.
on:
  schedule:
    - cron: "17 2 * * *" # 07:47 IST, before G starts
  workflow_dispatch: # lets you pull a new one on demand

permissions:
  contents: write

concurrency:
  group: daily-meme
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pick the best safe-for-work programming meme
        id: meme
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          # Programming-specific subs only: this README is read by recruiters, so
          # a general meme feed is the wrong pool regardless of how funny it is.
          SUBS = ["ProgrammerHumor", "programminghorror", "linuxmemes"]
          BATCH = 50            # the endpoint caps out around 44-50 returned
          MIN_UPS = 2000        # below this it is not worth a slot on the page
          RECENT_FILE = ".github/.meme-history.json"
          KEEP_RECENT = 30      # do not repeat a post within ~a month
          IMG = re.compile(r"^https://[\w.-]+\.(redd\.it|redditmedia\.com)/[\w./-]+\.(png|jpg|jpeg|gif)$")

          def fetch(sub):
              url = f"https://meme-api.com/gimme/{sub}/{BATCH}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "GopalGB-profile"})
                  with urllib.request.urlopen(req, timeout=25) as r:
                      return (json.load(r).get("memes") or [])
              except Exception as e:
                  print(f"  {sub}: fetch failed ({e})", file=sys.stderr)
                  return []

          try:
              recent = json.load(open(RECENT_FILE))
          except Exception:
              recent = []
          seen = set(recent)

          pool = []
          for sub in SUBS:
              got = fetch(sub)
              print(f"  {sub}: {len(got)} candidates")
              pool.extend(got)

          def ok(m):
              url = str(m.get("url") or "")
              return (
                  not m.get("nsfw")
                  and not m.get("spoiler")
                  and IMG.match(url)
                  and (m.get("ups") or 0) >= MIN_UPS
                  and str(m.get("postLink") or url) not in seen
              )

          good = sorted((m for m in pool if ok(m)), key=lambda m: -(m.get("ups") or 0))
          print(f"  {len(good)} cleared the {MIN_UPS}-upvote bar out of {len(pool)}")
          if not good:
              # Keeping yesterday's good meme beats publishing today's bad one.
              print("nothing cleared the bar; leaving README unchanged")
              sys.exit(0)

          best = good[0]
          url = best["url"]
          link = str(best.get("postLink") or url)
          sub = best.get("subreddit") or "ProgrammerHumor"
          ups = best.get("ups") or 0
          title = re.sub(r"[<>\[\]]", "", str(best.get("title") or "").strip())[:120] or "Programmer humor"

          block = (
              f'<p align="center">\n'
              f'  <a href="{link}"><img src="{url}" alt="{title}" width="480" /></a><br />\n'
              f'  <sub><b>{title}</b> — r/{sub} · {ups:,} upvotes</sub>\n'
              f'</p>'
          )

          readme = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"<!-- MEME:START -->.*?<!-- MEME:END -->",
              f"<!-- MEME:START -->\n{block}\n<!-- MEME:END -->",
              readme,
              flags=re.S,
          )
          if new == readme:
              print("unchanged")
              sys.exit(0)
          open("README.md", "w", encoding="utf-8").write(new)

          os.makedirs(os.path.dirname(RECENT_FILE), exist_ok=True)
          json.dump(([link] + recent)[:KEEP_RECENT], open(RECENT_FILE, "w"), indent=1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write("changed=true\n")
          print(f"picked {ups:,} upvotes: {title}")
          PY

      - name: Commit if it changed
        if: steps.meme.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/.meme-history.json
          git commit -m "chore(readme): daily meme refresh"
          git push
